# git-cliff config for @karmaniverous/smoz
# https://git-cliff.org/docs/configuration
#
# CHANGELOG.md: release-it's after:bump PREPENDS the new version
# (git-cliff --unreleased --tag <version> --prepend CHANGELOG.md). Never
# regenerate the whole file with -o: tags 0.1.0..0.2.10 are on the history
# before 0.2.11's rewrite, which main can't reach, so -o would drop them.
# GitHub release notes: release-it.github.releaseNotes (package.json).

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.\n
"""
body = """
{%- macro remote_url() -%}
  https://github.com/karmaniverous/smoz
{%- endmacro -%}
{% if version and previous.version %}\
    ## [{{ version }}]({{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% elif version %}\
    ## [{{ version }}]({{ self::remote_url() }}/tree/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% elif previous.version %}\
    ## [unreleased]({{ self::remote_url() }}/compare/{{ previous.version }}...HEAD)
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }} \
            ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
# Strip the branch prefix the add-issue commit hook adds (e.g. `[GH-33] `)
# so the commit still parses as conventional and lands in its group.
commit_preprocessors = [
  { pattern = '^\[[^\]]+\]\s*', replace = "" },
]
filter_unconventional = false
split_commits = false
commit_parsers = [
    # Every merge commit: pull requests, branches, remote-tracking branches
    # (merging origin/main into a PR branch to resolve a conflict).
    { message = "^Merge ", skip = true },
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
    { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
    { message = "^style", group = "<!-- 5 -->🎨 Styling" },
    { message = "^test", group = "<!-- 6 -->🧪 Testing" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore|^ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
    { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
    { message = ".*", group = "<!-- 10 -->💼 Other" },
]
filter_commits = false
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9]+)?$"
sort_commits = "oldest"
topo_order_commits = true
