name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # typecheck regenerates app/generated registers; fail if the committed
      # copies are stale.
      - name: Generated files up to date
        run: git diff --exit-code

      - name: Test
        run: npm test

      - name: Knip
        run: npm run knip

      - name: Build
        run: npm run build

      - name: Template typecheck
        run: npm run templates:typecheck

      - name: Template lint
        run: npm run templates:lint

      - name: Format check
        run: npm run format:check

      - name: Docs
        run: npm run docs

      - name: Audit (production dependencies, high and critical)
        run: npm audit --omit=dev --audit-level=high
