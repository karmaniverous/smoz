name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Knip
        run: npm run knip

      - name: Build
        run: npm run build

      - name: Template typecheck
        run: npm run templates:typecheck

      - name: Template lint
        run: npm run templates:lint

      - name: Format check
        run: npm run format:check

      - name: Docs
        run: npm run docs

      - name: Audit (production dependencies)
        run: npm audit --omit=dev
