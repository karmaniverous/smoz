name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies with npm 11.19.1
        run: npx --yes --package npm@11.19.1 npm ci

      # Every check, in the order release-it's after:init runs them: lint,
      # typecheck, generated files up to date, test, knip, build, packed
      # package, template typecheck and lint, format, docs.
      - name: Verify
        run: npm run verify

      - name: Audit (production dependencies, high and critical)
        run: npm audit --omit=dev --audit-level=high
